name: Python safety check
on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  DEP_PATH: server/requirements.txt

jobs:
  safety-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Security vulnerabilities scan
        uses: aufdenpunkt/python-safety-check@master
