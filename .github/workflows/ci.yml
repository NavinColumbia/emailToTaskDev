name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('server/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd server
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Set up test environment
      env:
        FLASK_ENV: test
        FLASK_SECRET: test-secret-key
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkw' }}
        GOOGLE_CLIENT_SECRETS_JSON: '{"web": {"client_id": "test", "client_secret": "test", "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token"}}'
        OPENAI_API_KEY: test-key
        OPENAI_MODEL: gpt-4o-mini
      run: |
        echo "Test environment configured"

    - name: Run tests
      env:
        FLASK_ENV: test
        FLASK_SECRET: test-secret-key
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0xMjM0NTY3ODkw' }}
        GOOGLE_CLIENT_SECRETS_JSON: '{"web": {"client_id": "test", "client_secret": "test", "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token"}}'
        OPENAI_API_KEY: test-key
        OPENAI_MODEL: gpt-4o-mini
      run: |
        cd server
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      run: |
        cd client
        npm install

    - name: Run linter
      run: |
        cd client
        npm run lint || echo "Linting completed with warnings"
      continue-on-error: true

    - name: Run tests
      run: |
        cd client
        npm run test -- --run || true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python linting tools
      run: |
        pip install flake8 black isort

    - name: Lint Python code
      run: |
        cd server
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
        black --check . || true
        isort --check-only . || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd client
        npm install

    - name: Lint frontend code
      run: |
        cd client
        npm run lint || echo "Linting completed with warnings"
      continue-on-error: true
